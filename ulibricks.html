<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ULIBRICKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2340; --muted:#5B6480; --tray:rgba(255,255,255,.95); --line:#E1E6F0;
  --chip:#F2F4F9; --sel:#FFC914; --danger:#E4262C; --danger-dark:#A8141A;
  --sky-top:#9FD3F2; --sky-bottom:#E4ECF3;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EEF1F8; --muted:#9AA3BD; --tray:rgba(24,30,46,.95); --line:#2E3854;
    --chip:#252E45; --sky-top:#0E1A34; --sky-bottom:#27334B;
  }
}
:root[data-theme="dark"]{
  --ink:#EEF1F8; --muted:#9AA3BD; --tray:rgba(24,30,46,.95); --line:#2E3854;
  --chip:#252E45; --sky-top:#0E1A34; --sky-bottom:#27334B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden}
body{height:100%;font-family:var(--body);color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 62%);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
[hidden]{display:none!important}

.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;pointer-events:none}
.top > *{pointer-events:auto}
.logo{display:flex;gap:3px;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(15px,2.4vw,21px);line-height:1}
.logo span{display:inline-grid;place-items:center;width:1.45em;height:1.55em;border-radius:4px;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);position:relative}
.logo span::before{content:"";position:absolute;top:-4px;left:50%;width:.6em;height:5px;margin-left:-.3em;border-radius:3px 3px 0 0;background:inherit}
.actions{display:flex;gap:8px;align-items:center;position:relative}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--tray);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.round svg{width:22px;height:22px}
.round:disabled{opacity:.4;cursor:default}
.round[aria-expanded="true"]{background:var(--sel);color:#1B2340}
#boomBtn{width:auto;height:52px;border-radius:26px;padding:0 18px 0 10px;gap:8px;display:flex;align-items:center;background:var(--danger);color:#fff;font-family:var(--display);font-size:15px;box-shadow:0 4px 0 var(--danger-dark);transition:transform .08s}
#boomBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--danger-dark)}
#boomBtn svg{width:36px;height:36px}
#boomBtn[aria-pressed="true"]{outline:3px solid var(--sel);outline-offset:3px}

#basePanel{position:absolute;right:0;top:58px;width:min(92vw,330px);background:var(--tray);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#basePanel .opts{flex-wrap:wrap}
.bshape{width:56px;height:54px;border-radius:10px;border:2px solid transparent;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;gap:2px}
.bshape svg{width:24px;height:24px}
.bshape[aria-pressed="true"]{background:var(--sel);color:#1B2340;border-color:#1B2340}
.sizeBtn{width:40px;justify-content:center;padding:0;font-size:18px;font-weight:800}
.sizeBtn:disabled{opacity:.35}
#baseSizeLabel{min-width:46px;text-align:center;font-weight:800;font-size:14px;align-self:center}

.tray{position:fixed;left:0;right:0;bottom:0;transition:transform .28s ease;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--tray);border-top:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:7px}
.tray.closed{transform:translateY(calc(100% - env(safe-area-inset-bottom,0px)))}
#trayToggle{position:absolute;left:50%;top:-38px;transform:translateX(-50%);height:38px;padding:0 16px 0 12px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:var(--tray);display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
#trayToggle svg{width:18px;height:18px;transition:transform .28s}
.tray.closed #trayToggle svg{transform:rotate(180deg)}
.trayGrid{display:flex;gap:14px;align-items:flex-start}
.pvCol,.toolCol{flex:none}
.mainCol{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.toolCol .opts{flex-direction:column}
.toolCol .tool{width:132px}
@media (max-width:640px){.trayGrid{gap:8px}.toolCol .tool{width:46px;height:46px;padding:0;justify-content:center}.toolCol .tool span{display:none}.toolCol .lbl{visibility:hidden}}
.row{display:flex;gap:16px;align-items:flex-end;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.group{display:flex;flex-direction:column;gap:4px;flex:none}
.lbl{font-size:12px;font-weight:700;color:var(--muted);padding-left:2px}
.opts{display:flex;gap:6px}
.shape{width:56px;height:52px;border-radius:10px;border:2px solid transparent;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:800;flex:none}
.shape svg{width:24px;height:24px}
.size{min-width:44px;height:36px;border-radius:9px;border:2px solid transparent;background:var(--chip);font-weight:800;font-size:14px;padding:0 8px;flex:none}
.shape[aria-pressed="true"],.size[aria-pressed="true"],.tool[aria-pressed="true"]{background:var(--sel);color:#1B2340;border-color:#1B2340}
.swatch{width:32px;height:32px;border-radius:7px;border:2px solid rgba(0,0,0,.14);position:relative;flex:none}
.swatch::after{content:"";position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:inherit;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 0 rgba(255,255,255,.35)}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.tool{height:42px;border-radius:10px;border:2px solid transparent;background:var(--chip);display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:800;font-size:13px;flex:none}
.tool svg{width:20px;height:20px}
.preview{position:relative;width:132px;height:112px;border-radius:12px;background:var(--chip);flex:none;overflow:hidden}
.preview canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.gripbtn{position:absolute;top:5px;left:50%;transform:translateX(-50%);height:24px;border-radius:12px;border:0;background:#1B2340;color:#fff;font-size:11px;font-weight:800;padding:0 9px;white-space:nowrap}
.rotbtn{position:absolute;bottom:5px;width:38px;height:38px;border-radius:50%;border:2px solid #1B2340;background:var(--sel);color:#1B2340;display:grid;place-items:center;padding:0}
.rotbtn svg{width:20px;height:20px}
#rotL{left:5px}#rotR{right:5px}
.lead{display:flex;gap:10px;align-items:flex-end}
.hint{font-size:12px;color:var(--muted);margin:0;max-width:30ch;line-height:1.3}
@media (max-width:640px){
  .hint{display:none}
  .top{padding:10px 12px}
  #boomBtn .txt{display:none}
  #boomBtn{padding:0 8px}
  .preview{width:104px;height:92px}
}
@media (max-width:560px){.logo{display:none}.top{justify-content:flex-end}}

#empty{position:fixed;left:50%;top:22%;transform:translateX(-50%);max-width:min(88vw,440px);text-align:center;font-weight:800;font-size:16px;line-height:1.35;background:var(--tray);padding:12px 18px;border-radius:14px;pointer-events:none;transition:opacity .3s}

#dynBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);background:#1B2340;color:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:94vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#dynBar .msg{font-weight:800;font-size:15px;padding:0 6px}
#dynBar button{height:36px;border-radius:18px;border:0;padding:0 14px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
#dynBar button[aria-pressed="true"]{background:#FFC914;color:#1B2340}
@media (max-width:640px){#dynBar{padding:8px;gap:6px;width:calc(100vw - 16px)}#dynBar .msg{width:100%;text-align:center;font-size:13px}#dynBar button{height:40px;padding:0 11px}}
#dynBar .go{background:var(--danger);font-family:var(--display);font-weight:400}

#count{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(90px,22vw,220px);color:#fff;-webkit-text-stroke:8px #E4262C;paint-order:stroke fill;text-shadow:0 10px 0 #7A1015;pointer-events:none;opacity:0}
#count.on{animation:cnt .95s ease-out forwards}
@keyframes cnt{0%{transform:translate(-50%,-50%) scale(1.8);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#boomText{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-family:var(--display);font-size:clamp(64px,16vw,190px);color:#FFC914;pointer-events:none;-webkit-text-stroke:6px #E4262C;paint-order:stroke fill;text-shadow:0 10px 0 #7A1015;opacity:0;white-space:nowrap}
#boomText.on{animation:boom 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-60%) scale(1.05) rotate(-6deg);opacity:0}}
@media (prefers-reduced-motion: reduce){
  #boomText.on,#count.on{animation:soft 1s forwards}
  @keyframes soft{0%,70%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}
}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-weight:800}
</style>
</head>
<body>
<canvas id="scene" aria-label="Area di costruzione 3D"></canvas>

<div class="top">
  <h1 class="logo" aria-label="ULIBRICKS"></h1>
  <div class="actions">
    <button class="round" id="undoBtn" title="Annulla (Z)" aria-label="Annulla" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="round" id="viewBtn" title="Rimetti la vista al centro" aria-label="Centra la vista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="round" id="soundBtn" title="Suono" aria-label="Suono attivo" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button class="round" id="baseBtn" title="Cambia la base" aria-label="Cambia forma, colore e dimensione della base" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M2 15l10 5 10-5-10-5z"/><circle cx="9" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="12.5" r="1" fill="currentColor"/><circle cx="15" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="15.5" r="1" fill="currentColor"/></svg></button>
    <button class="round" id="boomBtn" title="Dinamite" aria-label="Dinamite" aria-pressed="false">
      <svg viewBox="0 0 40 40"><g transform="rotate(-18 20 22)"><rect x="9" y="14" width="7" height="20" rx="2" fill="#fff"/><rect x="17" y="12" width="7" height="22" rx="2" fill="#FFE0DE"/><rect x="25" y="14" width="7" height="20" rx="2" fill="#fff"/><rect x="8" y="22" width="25" height="4" fill="#2B2B2B"/><path d="M20.5 12c0-4 3-6 6-6" stroke="#2B2B2B" stroke-width="2" fill="none"/></g><circle cx="29" cy="6" r="4" fill="#FFC914"/><circle cx="29" cy="6" r="2" fill="#fff"/></svg>
      <span class="txt">Dinamite</span>
    </button>
    <div id="basePanel" hidden>
      <span class="lbl">Forma della base</span><div class="opts" id="baseShapes"></div>
      <span class="lbl">Colore della base</span><div class="opts" id="baseColors"></div>
      <span class="lbl">Dimensione base</span>
      <div class="opts" id="baseSizeRow">
        <button class="tool sizeBtn" id="baseSizeMinus" aria-label="Rimpicciolisci la base">−</button>
        <span id="baseSizeLabel">100%</span>
        <button class="tool sizeBtn" id="baseSizePlus" aria-label="Ingrandisci la base">+</button>
      </div>
    </div>
  </div>
</div>

<p id="empty">Scegli un pezzo e tocca la base per posarlo. I pezzi si agganciano solo sui bottoncini.</p>

<div id="dynBar" hidden></div>

<div class="tray" id="tray" role="toolbar" aria-label="Strumenti di costruzione">
  <button id="trayToggle" aria-expanded="true" aria-controls="tray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span>Strumenti</span></button>
  <div class="trayGrid">
    <div class="group pvCol"><span class="lbl">Pezzo</span>
      <div class="preview">
        <canvas id="pv" aria-label="Anteprima del pezzo, tocca per ruotare"></canvas>
        <button class="gripbtn" id="gripBtn" title="Cambia il punto in cui tieni il pezzo (G)">Presa: centro</button>
        <button class="rotbtn" id="rotL" title="Ruota a sinistra (Q)" aria-label="Ruota a sinistra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></button>
        <button class="rotbtn" id="rotR" title="Ruota a destra (R)" aria-label="Ruota a destra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
      </div>
    </div>
    <div class="mainCol">
      <div class="row"><div class="group"><span class="lbl">Forma</span><div class="opts" id="shapes"></div></div></div>
      <div class="row"><div class="group"><span class="lbl">Misura</span><div class="opts" id="sizes"></div></div></div>
      <div class="row">
        <div class="group"><span class="lbl">Colori</span><div class="opts" id="colors"></div></div>
        <div class="group"><span class="lbl">Vetro</span><div class="opts" id="colorsT"></div></div>
        <div class="group"><span class="lbl">Metallici</span><div class="opts" id="colorsM"></div></div>
      </div>
    </div>
    <div class="group toolCol"><span class="lbl">Strumento</span><div class="opts" id="tools"></div></div>
  </div>
</div>

<div id="count"></div>
<div id="flash"></div>
<div id="boomText" aria-live="polite">BOOM!</div>
<div id="err">Il visore 3D non si è caricato. Ricarica la pagina con una connessione attiva.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.getElementById('err').style.display='grid';return;}
const V3=THREE.Vector3;

/* ================= DATI ================= */
const G=48, PH=.4, STUD_R=.3, STUD_H=.18, MAXP=150;
const SZ_B=[[1,1],[1,2],[1,3],[1,4],[1,6],[1,8],[1,10],[1,12],[2,2],[2,3],[2,4],[2,6],[2,8],[2,10]];
const SZ_P=SZ_B.concat([[4,4],[4,6],[4,8],[4,10],[4,12],[6,6],[6,8],[6,10],[6,12],[8,8],[8,16],[16,16]]);
const ROUND=['tondo','colonna','disco','bottone','cono','cupola'];
const SHAPES={
  mattone:{label:'Mattone',plates:3,studs:true,sizes:SZ_B,icon:'<rect x="3" y="9" width="18" height="11" rx="1.5"/><rect x="6" y="6" width="4" height="3"/><rect x="14" y="6" width="4" height="3"/>'},
  alto:{label:'Alto',plates:9,studs:true,sizes:[[1,1],[1,2],[1,4],[1,6],[2,2],[2,4]],icon:'<rect x="7" y="7" width="10" height="14" rx="1.5"/><rect x="8.5" y="4" width="3" height="3"/><rect x="12.5" y="4" width="3" height="3"/>'},
  piastra:{label:'Piastra',plates:1,studs:true,sizes:SZ_P,icon:'<rect x="3" y="13" width="18" height="6" rx="1.5"/><rect x="6" y="10" width="4" height="3"/><rect x="14" y="10" width="4" height="3"/>'},
  liscia:{label:'Liscia',plates:1,studs:false,sizes:[[1,1],[1,2],[1,3],[1,4],[1,6],[1,8],[2,2],[2,3],[2,4],[2,6],[4,4],[6,6]],icon:'<rect x="3" y="12" width="18" height="6" rx="1.5"/>'},
  tondo:{label:'Tondo',plates:3,studs:true,sizes:[[1,1],[2,2],[4,4],[6,6]],icon:'<path d="M6 10v8a6 2 0 0 0 12 0v-8"/><ellipse cx="12" cy="10" rx="6" ry="2"/><rect x="10" y="5" width="4" height="3"/>'},
  colonna:{label:'Colonna',plates:9,studs:true,sizes:[[1,1],[2,2]],icon:'<path d="M8 6v13a4 1.5 0 0 0 8 0V6"/><ellipse cx="12" cy="6" rx="4" ry="1.5"/>'},
  disco:{label:'Disco',plates:1,studs:true,sizes:[[1,1],[2,2],[4,4],[6,6],[8,8]],icon:'<ellipse cx="12" cy="13" rx="8" ry="3"/><path d="M4 13v3a8 3 0 0 0 16 0v-3"/>'},
  bottone:{label:'Tondino',plates:1,studs:false,sizes:[[1,1],[2,2]],icon:'<ellipse cx="12" cy="12" rx="5" ry="2"/><path d="M7 12v2.5a5 2 0 0 0 10 0V12"/>'},
  cono:{label:'Cono',plates:3,h:(w)=>w===1?3:w===2?6:9,studs:true,sizes:[[1,1],[2,2],[4,4]],icon:'<path d="M7 20h10l-2.5-11h-5z"/><rect x="10" y="5" width="4" height="4"/>'},
  cupola:{label:'Cupola',plates:3,h:(w)=>w*1.5,studs:false,sizes:[[2,2],[4,4],[6,6]],icon:'<path d="M4 18a8 8 0 0 1 16 0z"/>'},
  tegola:{label:'Tegola',plates:3,studs:true,sizes:[[1,2],[2,2],[3,2],[4,2],[6,2],[1,3],[2,3],[4,3],[1,4],[2,4]],icon:'<path d="M3 20h18v-3L11 8H3z"/><rect x="4" y="5" width="4" height="3"/>'},
  curva:{label:'Curva',plates:3,studs:false,sizes:[[1,2],[2,2],[1,3],[2,3],[1,4],[2,4],[4,4]],icon:'<path d="M3 20h18v-3C21 11 15 7 3 7z"/>'},
  rovescia:{label:'Rovescia',plates:3,studs:true,sizes:[[1,2],[2,2],[4,2],[1,3],[2,3]],icon:'<path d="M3 8h18v4l-10 8H3z"/><rect x="5" y="5" width="4" height="3"/><rect x="15" y="5" width="4" height="3"/>'},
  colmo:{label:'Colmo',plates:3,studs:false,sizes:[[1,2],[2,2],[4,2],[6,2]],icon:'<path d="M3 20h18v-3l-9-9-9 9z"/>'},
  spicchio:{label:'Spicchio',plates:2,studs:false,sizes:[[1,1],[2,1],[1,2],[2,2]],icon:'<path d="M5 19h14L5 11z"/>'},

let ac=null,master=null,muted=false,fuse=null;
function ensureAudio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.connect(ac.destination);}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function noiseBuf(sec){const b=ac.createBuffer(1,Math.floor(ac.sampleRate*sec),ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function tone(type,f0,f1,dur,vol,delay){
  if(!ac||muted)return;const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02);
}
function sndClack(){
  if(!ac||muted)return;const t=ac.currentTime;
  const s=ac.createBufferSource();s.buffer=noiseBuf(.05);
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=3;
  const g=ac.createGain();g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f).connect(g).connect(master);s.start(t);
  tone('triangle',950,480,.06,.25);
}
function sndPop(){tone('sine',620,140,.15,.35);}
function sndNope(){tone('square',180,120,.12,.12);tone('square',150,100,.12,.12,.12);}
function sndPaint(){tone('sine',660,650,.14,.18);tone('sine',990,980,.14,.18,.06);}
function sndBeep(f){tone('square',f,f*.99,.16,.2);}
function sndThud(){tone('sine',160,50,.25,.4);}
function fuseStart(){
  if(!ac||muted)return;
  const s=ac.createBufferSource();s.buffer=noiseBuf(1);s.loop=true;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=4200;f.Q.value=.9;
  const g=ac.createGain();g.gain.value=.12;s.connect(f).connect(g).connect(master);s.start();fuse={s,g};
}
function fuseCrackle(){if(fuse&&ac)fuse.g.gain.setTargetAtTime(.04+Math.random()*.3,ac.currentTime,.012);}
function fuseStop(){if(fuse){try{fuse.s.stop();}catch(e){}fuse=null;}}
function sndBoom(big){
  if(!ac||muted)return;const t=ac.currentTime,k=big?1:.7;
  const s=ac.createBufferSource();s.buffer=noiseBuf(2.6);
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(70,t+1.9);
  const g=ac.createGain();g.gain.setValueAtTime(1.4*k,t);g.gain.exponentialRampToValueAtTime(.001,t+2.5);
  s.connect(f).connect(g).connect(master);s.start(t);
  tone('sine',130,26,1.1,1.1*k);
}

const geoCache=new Map(),matCache=new Map(),cellCache=new Map();
function merge(list){
  let total=0;const parts=list.map(g=>{const ng=g.index?g.toNonIndexed():g;total+=ng.attributes.position.count;return ng;});
  const pos=new Float32Array(total*3),nor=new Float32Array(total*3);let o=0;
  for(const g of parts){pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);o+=g.attributes.position.count;}
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.computeBoundingBox();out.computeBoundingSphere();return out;
}
function stud(x,y,z){return new THREE.CylinderGeometry(STUD_R,STUD_R,STUD_H,16).translate(x,y+STUD_H/2,z);}
function localCells(shape,w,d){
  const k=shape+':'+w+'x'+d;if(cellCache.has(k))return cellCache.get(k);
  const S=SHAPES[shape],h=plates(shape,w,d),out=[];
  for(let x=0;x<w;x++)for(let z=0;z<d;z++){
    const c={x,z,y0:0,y1:h,stud:S.studs,socket:true};
    if(shape==='jumper')c.stud=(x===Math.floor((w-1)/2)&&z===Math.floor((d-1)/2));
    if(ROUND.indexOf(shape)>=0&&w>2){const r=Math.hypot(x+.5-w/2,z+.5-d/2);if(r>w/2)continue;if(r>w/2-.35)c.stud=false;}
    if(shape==='cono'&&w>1)c.stud=false;
    else if(shape==='tegola'){if(z>0)c.stud=false;}
    else if(shape==='rovescia'){if(z>0)c.socket=false;}
    else if(shape==='angolo'){if(x>0&&z>0)continue;}
    else if(shape==='arco'){if(z>0&&z<d-1){c.y0=h-1;c.socket=false;}}
    out.push(c);
  }
  cellCache.set(k,out);return out;
}
function profile(shape,w,d,h,g){
  const s=new THREE.Shape();
  if(shape==='tegola'){s.moveTo(g,0);s.lineTo(d-g,0);s.lineTo(d-g,.28);s.lineTo(1,h);s.lineTo(g,h);s.lineTo(g,0);}
  else if(shape==='rovescia'){s.moveTo(g,0);s.lineTo(1,0);s.lineTo(d-g,h-.28);s.lineTo(d-g,h);s.lineTo(g,h);s.lineTo(g,0);}
  else if(shape==='colmo'){s.moveTo(g,0);s.lineTo(d-g,0);s.lineTo(d-g,.3);s.lineTo(d/2,h);s.lineTo(g,.3);s.lineTo(g,0);}
  else if(shape==='curva'){s.moveTo(g,0);s.lineTo(d-g,0);s.lineTo(d-g,.25);s.absellipse(g,.25,d-2*g,h-.25,0,Math.PI/2,false);s.lineTo(g,0);}
  else if(shape==='spicchio'){s.moveTo(g,0);s.lineTo(d-g,0);s.lineTo(d-g,.06);s.lineTo(g,h);s.lineTo(g,0);}
  else {s.moveTo(g,0);s.lineTo(1,0);s.absellipse(d/2,0,d/2-1,h-.45,Math.PI,0,true);s.lineTo(d-g,0);s.lineTo(d-g,h);s.lineTo(g,h);s.lineTo(g,0);}
  const eg=new THREE.ExtrudeGeometry(s,{depth:w-2*g,bevelEnabled:false,curveSegments:18});
  eg.translate(0,0,g);eg.rotateY(-Math.PI/2);eg.translate(w/2,0,-d/2);return eg;
}
function brickGeo(shape,w,d){
  const k=shape+':'+w+'x'+d;if(geoCache.has(k))return geoCache.get(k);
  const h=plates(shape,w,d)*PH,g=.02,parts=[];
  if(shape==='tondo'||shape==='disco'||shape==='bottone'||shape==='colonna')parts.push(new THREE.CylinderGeometry(w/2-g,w/2-g,h,32).translate(0,h/2,0));
  else if(shape==='cono')parts.push(new THREE.CylinderGeometry(w===1?.32:.06,w/2-g,h,28).translate(0,h/2,0));
  else if(shape==='cupola'){const r=w/2-g;
    parts.push(new THREE.SphereGeometry(r,32,14,0,Math.PI*2,0,Math.PI/2).scale(1,h/r,1));
    parts.push(new THREE.CircleGeometry(r,32).rotateX(Math.PI/2));}
  else if(['tegola','rovescia','colmo','arco','curva','spicchio'].indexOf(shape)>=0)parts.push(profile(shape,w,d,h,g));
  else if(shape==='angolo'){
    parts.push(new THREE.BoxGeometry(w-2*g,h,1-2*g).translate(0,h/2,-d/2+.5));
    parts.push(new THREE.BoxGeometry(1-2*g,h,d-1-g).translate(-w/2+.5,h/2,(1-g)/2));
  } else if(shape==='finestra'){
    const t=.4,x=w-2*g;
    parts.push(new THREE.BoxGeometry(x,t,d-2*g).translate(0,t/2,0));
    parts.push(new THREE.BoxGeometry(x,t,d-2*g).translate(0,h-t/2,0));
    parts.push(new THREE.BoxGeometry(x,h-2*t,.35).translate(0,h/2,-d/2+g+.175));
    parts.push(new THREE.BoxGeometry(x,h-2*t,.35).translate(0,h/2,d/2-g-.175));
  } else if(shape==='barra'){
    parts.push(new THREE.CylinderGeometry(.16,.16,w-.44,14).rotateZ(Math.PI/2).translate(0,h/2+.06,0));
    parts.push(new THREE.SphereGeometry(.26,14,10).translate(-w/2+.24,h/2+.06,0));
    parts.push(new THREE.SphereGeometry(.26,14,10).translate(w/2-.24,h/2+.06,0));
  } else parts.push(new THREE.BoxGeometry(w-2*g,h,d-2*g).translate(0,h/2,0));
  if(shape==='snot'){for(let x=0;x<w;x++)parts.push(new THREE.CylinderGeometry(STUD_R,STUD_R,STUD_H,14).rotateX(Math.PI/2).translate(x+.5-w/2,h/2,-d/2-STUD_H/2+g));}
  if(shape==='clip'){
    parts.push(new THREE.BoxGeometry(.46,.4,.12).translate(0,h*.42,-d/2-.04));
    parts.push(new THREE.BoxGeometry(.14,.4,.36).translate(-.2,h*.42,-d/2-.1));
    parts.push(new THREE.BoxGeometry(.14,.4,.36).translate(.2,h*.42,-d/2-.1));
  }
  localCells(shape,w,d).forEach(c=>{if(c.stud)parts.push(stud(c.x+.5-w/2,c.y1*PH,c.z+.5-d/2));});
  const m=merge(parts);geoCache.set(k,m);return m;
}
function paneGeo(w,d){
  const k='pane:'+w+'x'+d;if(geoCache.has(k))return geoCache.get(k);
  const h=plates('finestra',w,d)*PH,g=new THREE.BoxGeometry(.08,h-.8,d-.72).translate(0,h/2,0);geoCache.set(k,g);return g;
}
let envTex=null;
function getEnv(){

function mat(code){

/* ---------- base ---------- */
const baseMat=new THREE.MeshStandardMaterial({color:base.color,roughness:.45});
const baseStudGeo=new THREE.CylinderGeometry(STUD_R,STUD_R,STUD_H,12).translate(0,STUD_H/2,0);
let baseMesh=null,baseStuds=null;
function buildBase(){
  const T=BASES[base.shape].test;let count=0;
  for(let i=0;i<G;i++)for(let j=0;j<G;j++){const v=T(i+.5-G/2,j+.5-G/2,base.mult)?1:0;mask[i*G+j]=v;count+=v;}
  if(baseMesh){scene.remove(baseMesh);baseMesh.geometry.dispose();}
  if(baseStuds){scene.remove(baseStuds);baseStuds.dispose&&baseStuds.dispose();}
  const boxes=[];
  for(let j=0;j<G;j++){let i=0;while(i<G){if(!mask[i*G+j]){i++;continue;}let e=i;while(e<G&&mask[e*G+j])e++;
    boxes.push(new THREE.BoxGeometry(e-i,.3,1).translate((i+e)/2-G/2,-.15,j+.5-G/2));i=e;}}
  baseMesh=new THREE.Mesh(merge(boxes),baseMat);baseMesh.receiveShadow=true;scene.add(baseMesh);
  baseStuds=new THREE.InstancedMesh(baseStudGeo,baseMat,count);
  const m=new THREE.Matrix4();let k=0;
  for(let i=0;i<G;i++)for(let j=0;j<G;j++)if(mask[i*G+j]){m.makeTranslation(i+.5-G/2,0,j+.5-G/2);baseStuds.setMatrixAt(k++,m);}
  baseStuds.receiveShadow=true;scene.add(baseStuds);
  baseMat.color.set(base.color);
}

/* ---------- mattoncini e incastri ---------- */
function fp(w,d,rot){return rot%2?[d,w]:[w,d];}
function worldCells(data){
  const [fw,fd]=fp(data.w,data.d,data.rot),th=-data.rot*Math.PI/2,c=Math.cos(th),s=Math.sin(th);
  return localCells(data.shape,data.w,data.d).map(k=>{
    const lx=k.x+.5-data.w/2,lz=k.z+.5-data.d/2,x=lx*c+lz*s,z=-lx*s+lz*c;
    return{i:data.i0+Math.round(fw/2+x-.5),j:data.j0+Math.round(fd/2+z-.5),y0:data.level+k.y0,y1:data.level+k.y1,stud:k.stud,socket:k.socket};
  });
}
function placeMesh(mesh,data){
  const [fw,fd]=fp(data.w,data.d,data.rot);
  mesh.position.set(data.i0+fw/2-G/2,data.level*PH,data.j0+fd/2-G/2);
  mesh.rotation.set(0,-data.rot*Math.PI/2,0);mesh.scale.set(1,1,1);
}
function makeBrick(data){
  const mesh=new THREE.Mesh(brickGeo(data.shape,data.w,data.d),mat(data.color));
  styleMesh(mesh,data.color);placeMesh(mesh,data);
  if(data.shape==='finestra'){const pane=new THREE.Mesh(paneGeo(data.w,data.d),mat('T#E9F4FA'));pane.renderOrder=1;mesh.add(pane);}
  const b={shape:data.shape,w:data.w,d:data.d,color:data.color,rot:data.rot,i0:data.i0,j0:data.j0,level:data.level,mesh,cells:worldCells(data)};

  if(drag&&p){
    const dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>7)drag.moved=true;
    if(drag.moved){
      if(drag.button===2||e.shiftKey)pan(dx,dy);else{cam.theta-=dx*.008;cam.phi=clamp(cam.phi-dy*.008,.18,1.5);}
      hideHover();
    }
    return;
  }
  if(e.pointerType==='mouse'){if(dyn.mode==='aim')aimAt(e.clientX,e.clientY);else if(!dyn.mode)updateHover(e.clientX,e.clientY);}
});
function endPtr(e){
  const had=ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchPrev=null;
  if(ptrs.size===0&&drag){
    const tap=had&&e.type==='pointerup'&&!drag.moved&&!drag.multi;
    if(tap&&drag.button===0){
      if(dyn.mode==='aim')placeDyn(e.clientX,e.clientY);
      else if(dyn.mode==='armed')ignite();
      else if(!dyn.mode){updateHover(e.clientX,e.clientY);act();}
    } else if(tap&&drag.button===2&&!dyn.mode){rotate(1);}
    drag=null;
    if(e.pointerType==='mouse'&&!dyn.mode)updateHover(e.clientX,e.clientY);
  }
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!drag){hideHover();if(dyn.mode==='aim'){dynObj.visible=false;ring.visible=false;}}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.radius=clamp(cam.radius*Math.exp(e.deltaY*.0012),10,100);},{passive:false});
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='escape'){cancelDyn();closeBase();if(carry){cancelCarry();renderUI();afterChange();}}
  else if(k==='r'||k==='e')rotate(1);
  else if(k==='q')rotate(-1);
  else if(k==='z'){e.preventDefault();undo();}
  else if(k==='g')cycleGrip();
  else if(k==='1')setMode('build');else if(k==='2')setMode('move');else if(k==='3')setMode('erase');else if(k==='4')setMode('paint');
});

/* ================= ANTEPRIMA PEZZO ================= */
const pv=document.getElementById('pv');
const pr=new THREE.WebGLRenderer({canvas:pv,antialias:true,alpha:true});
pr.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const pscene=new THREE.Scene();
pscene.add(new THREE.HemisphereLight(0xffffff,0x8a9bb0,.85));
const pl=new THREE.DirectionalLight(0xffffff,.6);pl.position.set(4,8,6);pscene.add(pl);
const pcam=new THREE.PerspectiveCamera(30,1,.1,200);
const pmesh=new THREE.Mesh(brickGeo('mattone',2,4),mat(state.color));pscene.add(pmesh);
const parrow=new THREE.Mesh(new THREE.ConeGeometry(.35,.7,16),new THREE.MeshBasicMaterial({color:0x1B2340}));
parrow.rotation.x=Math.PI/2;pscene.add(parrow);
const pgrip=new THREE.Mesh(new THREE.TorusGeometry(.36,.09,8,24),new THREE.MeshBasicMaterial({color:0xFFC914,depthTest:false}));pgrip.rotation.x=Math.PI/2;pgrip.renderOrder=5;pmesh.add(pgrip);
let pvAngle=0,pvDirty=true;
function pvResize(){const r=pv.getBoundingClientRect();if(r.width>0){pr.setSize(r.width,r.height,false);pcam.aspect=r.width/r.height;pcam.updateProjectionMatrix();pvDirty=true;}}
function pvUpdate(){
  const sp=spec(),w=sp.w,d=sp.d,h=plates(sp.shape,w,d)*PH;
  pmesh.geometry=brickGeo(sp.shape,w,d);pmesh.material=mat(sp.color);pmesh.position.set(0,-h/2,0);
  const g=gripCell(sp);pgrip.visible=w*d>1;pgrip.position.set(g.gx+.5-w/2,h+STUD_H+.08,g.gz+.5-d/2);
  document.getElementById('gripBtn').textContent=(carry&&carry.grip)?'Presa: dove l’hai preso':'Presa: '+{centro:'centro',inizio:'capo A',fine:'capo B'}[state.grip];
  const m=Math.max(w,d,h*1.2);
  pcam.position.set(m*1.5,m*1.55,m*2.1);pcam.lookAt(0,0,0);
  parrow.scale.setScalar(Math.max(.8,m/3));pvDirty=true;
}
function pvTick(dt){
  const sp=spec(),target=-sp.rot*Math.PI/2;
  let diff=target-pvAngle;
  if(Math.abs(diff)>.001){pvAngle+=diff*Math.min(1,dt*14);pvDirty=true;}else pvAngle=target;
  if(!pvDirty)return;
  pmesh.rotation.y=pvAngle;
  const w=sp.w,d=sp.d;
  const lz=d/2+.7;parrow.position.set(lz*Math.sin(pvAngle),-plates(sp.shape,w,d)*PH/2,lz*Math.cos(pvAngle));
  parrow.rotation.set(Math.PI/2,0,0);parrow.rotation.z=0;parrow.rotateOnWorldAxis(new V3(0,1,0),pvAngle);
  pr.render(pscene,pcam);pvDirty=false;
}
pv.addEventListener('click',()=>rotate(1));
document.getElementById('rotL').addEventListener('click',()=>rotate(-1));
document.getElementById('rotR').addEventListener('click',()=>rotate(1));
function cycleGrip(){if(carry&&carry.grip)carry.grip=null;else{const o=['centro','inizio','fine'];state.grip=o[(o.indexOf(state.grip)+1)%3];}renderUI();}
document.getElementById('gripBtn').addEventListener('click',e=>{e.stopPropagation();cycleGrip();});
if(window.ResizeObserver)new ResizeObserver(pvResize).observe(pv);
window.addEventListener('resize',pvResize);

/* ================= INTERFACCIA ================= */
const svgIcon=(inner,sw)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linejoin="round" stroke-linecap="round">'+inner+'</svg>';
const logo=document.querySelector('.logo');
'ULIBRICKS'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch.toUpperCase();s.setAttribute('aria-hidden','true');s.style.background=COLORS[[0,3,6,11,13,17,20,4,24][i]];logo.appendChild(s);});
const shapesEl=document.getElementById('shapes'),sizesEl=document.getElementById('sizes'),toolsEl=document.getElementById('tools');
Object.keys(SHAPES).forEach(id=>{
  const b=document.createElement('button');b.className='shape';b.dataset.id=id;
  b.innerHTML=svgIcon(SHAPES[id].icon)+'<span>'+SHAPES[id].label+'</span>';
  b.addEventListener('click',()=>{state.shape=id;const S=SHAPES[id];
    if(!S.sizes.some(s=>s[0]===state.size[0]&&s[1]===state.size[1]))state.size=S.sizes[Math.min(S.sizes.length-1,S.sizes.findIndex(s=>s[0]*s[1]>=4)<0?0:S.sizes.findIndex(s=>s[0]*s[1]>=4))].slice();
    toBuild();renderUI();});
  shapesEl.appendChild(b);
});
function swatchBg(code){
  const hex=hexOf(code);
  if(code[0]==='T'){const c=new THREE.Color(hex),rgba='rgba('+Math.round(c.r*255)+','+Math.round(c.g*255)+','+Math.round(c.b*255)+',.55)';
    return 'linear-gradient('+rgba+','+rgba+'),repeating-conic-gradient(#c9ced6 0 25%,#fff 0 50%) 0 0/10px 10px';}
  if(code[0]==='M')return 'linear-gradient(135deg,#fff 0%,'+hex+' 35%,'+hex+' 60%,#333 100%)';
  return hex;
}
const colorEls=[];
Object.keys(COLOR_GROUPS).forEach(gid=>{
  const host=document.getElementById(gid);
  COLOR_GROUPS[gid].forEach(([c,n])=>{
    const b=document.createElement('button');b.className='swatch';b.style.background=swatchBg(c);b.dataset.c=c;b.setAttribute('aria-label','Colore '+n);b.title=n;
    b.addEventListener('click',()=>{state.color=c;if(state.mode==='erase')setMode('build');renderUI();});
    host.appendChild(b);colorEls.push(b);
  });
});
TOOLS.forEach(t=>{
  const b=document.createElement('button');b.className='tool';b.dataset.id=t.id;
  b.innerHTML=svgIcon(t.icon,2.4)+'<span>'+t.label+'</span>';b.addEventListener('click',()=>setMode(t.id));
  toolsEl.appendChild(b);
});
function toBuild(){if(dyn.mode&&dyn.mode!=='count')cancelDyn();cancelCarry();if(state.mode!=='build')state.mode='build';}
function setMode(m){if(dyn.mode&&dyn.mode!=='count')cancelDyn();cancelCarry();state.mode=m;hideHover();renderUI();}
function rotate(dir){if(carry){carry.rot=(carry.rot+dir+4)%4;renderUI();return;}state.rot=(state.rot+dir+4)%4;toBuild();renderUI();}
function renderUI(){
  shapesEl.querySelectorAll('.shape').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===state.shape));
  sizesEl.innerHTML='';
  SHAPES[state.shape].sizes.forEach(s=>{
    const b=document.createElement('button');b.className='size';b.textContent=s[0]+'×'+s[1];
    b.setAttribute('aria-pressed',s[0]===state.size[0]&&s[1]===state.size[1]);
    b.addEventListener('click',()=>{state.size=s.slice();toBuild();renderUI();});
    sizesEl.appendChild(b);
  });
  colorEls.forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===state.color));
  toolsEl.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===state.mode));
  canvas.style.cursor=state.mode==='build'?'crosshair':state.mode==='erase'?'not-allowed':state.mode==='move'?(carry?'grabbing':'grab'):'cell';
  pvUpdate();
  if(lastPointer&&lastPointerType==='mouse'&&!dyn.mode)updateHover(lastPointer.x,lastPointer.y);
}
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('viewBtn').addEventListener('click',resetView);
const soundBtn=document.getElementById('soundBtn');
soundBtn.addEventListener('click',()=>{ensureAudio();muted=!muted;soundBtn.setAttribute('aria-pressed',!muted);soundBtn.setAttribute('aria-label',muted?'Suono spento':'Suono attivo');soundBtn.querySelector('.wave').style.display=muted?'none':'';if(muted)fuseStop();});
document.getElementById('boomBtn').addEventListener('click',()=>{if(dyn.mode==='count')return;if(dyn.mode)cancelDyn();else enterAim();});

/* ---------- vassoio apribile ---------- */
const tray=document.getElementById('tray'),trayToggle=document.getElementById('trayToggle');
let trayWasOpen=true;
function setTray(open){tray.classList.toggle('closed',!open);trayToggle.setAttribute('aria-expanded',open);trayToggle.querySelector('span').textContent=open?'Nascondi':'Strumenti';}
trayToggle.addEventListener('click',()=>setTray(tray.classList.contains('closed')));
setTray(true);

/* ---------- pannello base ---------- */
const baseBtn=document.getElementById('baseBtn'),basePanel=document.getElementById('basePanel');
const baseShapesEl=document.getElementById('baseShapes'),baseColorsEl=document.getElementById('baseColors');
function closeBase(){basePanel.hidden=true;baseBtn.setAttribute('aria-expanded','false');}
baseBtn.addEventListener('click',e=>{e.stopPropagation();const open=basePanel.hidden;basePanel.hidden=!open;baseBtn.setAttribute('aria-expanded',open);});
Object.keys(BASES).forEach(id=>{
  const b=document.createElement('button');b.className='bshape';b.dataset.id=id;
  b.innerHTML=svgIcon(BASES[id].icon)+'<span>'+BASES[id].label+'</span>';
  b.addEventListener('click',()=>{if(base.shape===id||dyn.mode==='count')return;cancelCarry();base.shape=id;base.mult=clampMult(id,base.mult);buildBase();
    const fallen=settle(false);if(fallen.length)setTimeout(sndThud,350);undoStack=[];renderBase();afterChange();});
  baseShapesEl.appendChild(b);
});
BASE_COLORS.forEach(([c,n])=>{
  const b=document.createElement('button');b.className='swatch';b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Base '+n);
  b.addEventListener('click',()=>{base.color=c;baseMat.color.set(c);renderBase();scheduleSave();});
  baseColorsEl.appendChild(b);
});
const baseSizeMinus=document.getElementById('baseSizeMinus'),baseSizePlus=document.getElementById('baseSizePlus'),baseSizeLabel=document.getElementById('baseSizeLabel');
function applyBaseSize(delta){
  base.mult=clampMult(base.shape,base.mult+delta);buildBase();
  const fallen=settle(false);if(fallen.length)setTimeout(sndThud,350);
  renderBase();afterChange();
}
baseSizeMinus.addEventListener('click',()=>applyBaseSize(-.1));
baseSizePlus.addEventListener('click',()=>applyBaseSize(.1));
function renderBase(){
  baseShapesEl.querySelectorAll('.bshape').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===base.shape));
  baseColorsEl.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===base.color));
  baseSizeLabel.textContent=Math.round(base.mult*100)+'%';
  baseSizeMinus.disabled=base.mult<=.5+1e-9;baseSizePlus.disabled=base.mult>=maxMult(base.shape)-1e-9;
}

/* ================= SALVATAGGIO ================= */
const KEY='ulibricks-v1';let saveTimer=0;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify({base:{shape:base.shape,color:base.color,mult:base.mult},b:bricks.map(b=>[b.shape,b.w,b.d,b.color,b.rot,b.i0,b.j0,b.level])}));}catch(e){}
},300);}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  let data=null;try{data=raw?JSON.parse(raw):null;}catch(e){}
  if(data&&data.base&&BASES[data.base.shape]){base.shape=data.base.shape;base.color=data.base.color||base.color;base.mult=clampMult(base.shape,data.base.mult||1);}
  buildBase();
  if(!data||!Array.isArray(data.b))return;
  data.b.forEach(a=>{if(!SHAPES[a[0]])return;const d={shape:a[0],w:a[1],d:a[2],color:a[3],rot:a[4],i0:a[5],j0:a[6],level:a[7]};
    const cells=worldCells(d);if(cells.some(c=>c.i<0||c.j<0||c.i>=G||c.j>=G||[...Array(c.y1-c.y0)].some((_,k)=>occ.has(key(c.i,c.j,c.y0+k)))))return;
    attach(makeBrick(d),false);});
  settle(true);
}

/* ================= LOOP ================= */
let last=performance.now();const tmp=new V3();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;

  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt/.12;const k=Math.min(1,d.t);
    d.b.mesh.position.y=d.b.level*PH+.7*(1-k)*(1-k);if(k>=1)drops.splice(i,1);}

  if(dyn.mode==='armed'){const s=1+Math.sin(now/180)*.04;dynObj.scale.set(s,s,s);}else dynObj.scale.set(1,1,1);
  if(dyn.mode==='count'){
    const t=(now-dyn.start)/1000;
    fuseMesh.scale.y=Math.max(.03,1-t/3);
    dynObj.updateMatrixWorld(true);
    tmp.set(0,fuseMesh.scale.y,0).applyAxisAngle(new V3(0,0,1),fuseMesh.rotation.z).add(fuseMesh.position);
    spark.position.copy(tmp);spark.scale.setScalar(.6+Math.random()*.7);
    fuseCrackle();
    const w=dynObj.localToWorld(tmp.clone());
    spawn(w,{color:0xFFD34A,additive:true,size:.22,v:new V3(rnd(-3,3),rnd(1,5),rnd(-3,3)),life:rnd(.25,.5),g:-14,kind:'spark'});
    const n=3-Math.floor(t);
    if(n>0&&n!==dyn.lastN){dyn.lastN=n;showCount(n);sndBeep(n===1?1320:880);}
    if(t>=3)boom();
  }

  for(let i=flying.length-1;i>=0;i--){
    const f=flying[i];f.age+=dt;f.v.y-=28*dt;
    const p=f.mesh.position;p.addScaledVector(f.v,dt);
    f.mesh.rotation.x+=f.w.x*dt;f.mesh.rotation.y+=f.w.y*dt;f.mesh.rotation.z+=f.w.z*dt;
    const ci=Math.floor(p.x+G/2),cj=Math.floor(p.z+G/2);
    const fl=(ci>=0&&cj>=0&&ci<G&&cj<G&&mask[ci*G+cj])?0:-.3;
    if(p.y<fl){p.y=fl;if(f.v.y<0)f.v.y*=-.35;f.v.x*=.72;f.v.z*=.72;f.w.multiplyScalar(.65);}
    if(f.age>2.6){const k=Math.max(0,1-(f.age-2.6)/.8);f.mesh.scale.setScalar(k);if(k<=0){scene.remove(f.mesh);flying.splice(i,1);}}
  }

  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.age+=dt;const k=q.age/q.life;
    if(k>=1){scene.remove(q.s);q.s.material.dispose();particles.splice(i,1);continue;}
    q.v.multiplyScalar(Math.max(0,1-q.drag*dt));q.v.y+=q.g*dt;q.s.position.addScaledVector(q.v,dt);
    q.s.scale.setScalar(q.size*(1+q.grow*k));q.s.material.opacity=q.op*(1-k);
    if(q.kind==='fire'){q.s.material.color.copy(fireA).lerp(fireB,Math.min(1,k*2));if(k>.5)q.s.material.color.lerp(fireC,(k-.5)*2);}
  }

  if(flashLight.intensity>0){flashLight.intensity*=Math.pow(.015,dt);if(flashLight.intensity<.02)flashLight.intensity=0;}
  if(shake>0)shake=Math.max(0,shake-dt*1.5);

  updateCamera();renderer.render(scene,camera);
  pvTick(dt);
  requestAnimationFrame(frame);
}

let hintGone=false;
function dismissHint(){if(hintGone)return;hintGone=true;const el=document.getElementById('empty');el.style.opacity='0';setTimeout(()=>{el.hidden=true;},300);}
setTimeout(dismissHint,3000);
window.addEventListener('pointerdown',dismissHint,{capture:true,once:true});
window.addEventListener('keydown',dismissHint,{once:true});
load();renderBase();pvResize();renderUI();afterChange();
requestAnimationFrame(frame);
})();
</script>
