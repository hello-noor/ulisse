<!doctype html>
<html lang="it" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ULIBRICKS: il gioco, in 60 secondi</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --red:#e5222d; --yellow:#ffc72c; --blue:#2559e6; --green:#1fbf84; --orange:#ff8a1f; --pink:#ff7ab6; --ink:#1b1b2f; --cream:#fff1d0; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#111423; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:Montserrat, sans-serif; color:var(--ink); background:#111423; }
      .vid { position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover; }
      .abs { position:absolute; }
      .brick { position:absolute; background:var(--c); border-radius:14px;
        box-shadow: inset 0 -12px 0 rgba(0,0,0,.2), inset 0 6px 0 rgba(255,255,255,.3), 0 12px 0 rgba(0,0,0,.28); }
      .stud { position:absolute; top:-18px; height:24px; border-radius:12px 12px 4px 4px; background:var(--c);
        box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35); }
      .bl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:"Archivo Black", sans-serif; line-height:1; white-space:nowrap; }
      .chip { position:absolute; left:40px; background:#fff; color:var(--ink); border-radius:56px; height:100px; padding:0 40px;
        display:flex; align-items:center; gap:22px; box-shadow:0 10px 0 rgba(0,0,0,.28); }
      .chip .n { font-family:"Archivo Black", sans-serif; font-size:60px; line-height:1; }
      .chip .n sup { font-size:.5em; vertical-align:top; position:relative; top:-.1em; }
      .chip .t { font-weight:800; font-size:34px; line-height:1.05; }
      .strip { position:absolute; left:0; width:1080px; height:241px; background:var(--c); box-shadow:inset 0 -14px 0 rgba(0,0,0,.2), inset 0 8px 0 rgba(255,255,255,.28); }
      #wipes { position:absolute; inset:0; z-index:50; pointer-events:none; }
      #over { position:absolute; inset:0; z-index:20; pointer-events:none; }
      .txt { position:absolute; left:0; width:100%; text-align:center; font-weight:900; line-height:1.1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1080" data-height="1920">
      <video id="v-intro" class="clip vid" src="assets/v/scene.mp4" muted playsinline data-start="0" data-duration="4" data-media-start="0.3" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-tray" class="clip vid" src="assets/v/tray.mp4" muted playsinline data-start="4" data-duration="6" data-media-start="0.5" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-kit" class="clip vid" src="assets/v/kit.mp4" muted playsinline data-start="10" data-duration="10" data-media-start="0.8" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-creator" class="clip vid" src="assets/v/creator.mp4" muted playsinline data-start="20" data-duration="7" data-media-start="0.2" data-playback-rate="1.15" data-track-index="1"></video>
      <video id="v-scene" class="clip vid" src="assets/v/scene.mp4" muted playsinline data-start="27" data-duration="5" data-media-start="1.5" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-dyn" class="clip vid" src="assets/v/dyn.mp4" muted playsinline data-start="32" data-duration="4" data-media-start="3.6" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-tetris" class="clip vid" src="assets/v/tetris.mp4" muted playsinline data-start="36" data-duration="4" data-media-start="4" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-quake" class="clip vid" src="assets/v/quake.mp4" muted playsinline data-start="40" data-duration="4" data-media-start="1" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-run" class="clip vid" src="assets/v/run.mp4" muted playsinline data-start="44" data-duration="4" data-media-start="2" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-reelA" class="clip vid" src="assets/v/reel.mp4" muted playsinline data-start="48" data-duration="2.5" data-media-start="5.5" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-reelB" class="clip vid" src="assets/v/reel.mp4" muted playsinline data-start="50.5" data-duration="2.5" data-media-start="11" data-playback-rate="1" data-track-index="1"></video>
      <video id="v-share" class="clip vid" src="assets/v/share.mp4" muted playsinline data-start="53" data-duration="3" data-media-start="0.6" data-playback-rate="1" data-track-index="1"></video>
      <div id="over" class="clip" data-start="0" data-duration="60" data-track-index="3"></div>
      <div id="wipes" class="clip" data-start="0" data-duration="60" data-track-index="5"></div>
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="60" data-track-index="10" data-volume="0.5"></audio>
      <audio id="x00" src="assets/sfx/sfx_003.mp3" data-start="0.50" data-duration="2.00" data-track-index="12" data-volume="0.7"></audio>
      <audio id="x01" src="assets/sfx/sfx_002.mp3" data-start="3.50" data-duration="0.60" data-track-index="13" data-volume="0.6"></audio>
      <audio id="x02" src="assets/sfx/sfx_003.mp3" data-start="4.60" data-duration="2.00" data-track-index="14" data-volume="0.55"></audio>
      <audio id="x03" src="assets/sfx/sfx_005.mp3" data-start="5.20" data-duration="0.70" data-track-index="15" data-volume="0.7"></audio>
      <audio id="x04" src="assets/sfx/sfx_001.mp3" data-start="5.90" data-duration="0.70" data-track-index="16" data-volume="0.7"></audio>
      <audio id="x05" src="assets/sfx/sfx_005.mp3" data-start="6.60" data-duration="0.70" data-track-index="12" data-volume="0.7"></audio>
      <audio id="x06" src="assets/sfx/sfx_002.mp3" data-start="9.50" data-duration="0.60" data-track-index="13" data-volume="0.6"></audio>
      <audio id="x07" src="assets/sfx/sfx_003.mp3" data-start="10.55" data-duration="2.00" data-track-index="14" data-volume="0.55"></audio>
      <audio id="x08" src="assets/sfx/sfx_005.mp3" data-start="11.20" data-duration="0.70" data-track-index="15" data-volume="0.7"></audio>
      <audio id="x09" src="assets/sfx/sfx_002.mp3" data-start="19.50" data-duration="0.60" data-track-index="16" data-volume="0.6"></audio>
      <audio id="x10" src="assets/sfx/sfx_003.mp3" data-start="20.55" data-duration="2.00" data-track-index="12" data-volume="0.55"></audio>
      <audio id="x11" src="assets/sfx/sfx_005.mp3" data-start="21.40" data-duration="0.70" data-track-index="13" data-volume="0.7"></audio>
      <audio id="x12" src="assets/sfx/sfx_001.mp3" data-start="22.40" data-duration="0.70" data-track-index="14" data-volume="0.7"></audio>
      <audio id="x13" src="assets/sfx/sfx_002.mp3" data-start="26.50" data-duration="0.60" data-track-index="15" data-volume="0.6"></audio>
      <audio id="x14" src="assets/sfx/sfx_003.mp3" data-start="27.45" data-duration="2.00" data-track-index="16" data-volume="0.55"></audio>
      <audio id="x15" src="assets/sfx/sfx_001.mp3" data-start="28.20" data-duration="0.70" data-track-index="12" data-volume="0.7"></audio>
      <audio id="x16" src="assets/sfx/sfx_002.mp3" data-start="31.50" data-duration="0.60" data-track-index="13" data-volume="0.6"></audio>
      <audio id="x17" src="assets/sfx/sfx_003.mp3" data-start="32.45" data-duration="2.00" data-track-index="14" data-volume="0.55"></audio>
      <audio id="x18" src="assets/sfx/sfx_002.mp3" data-start="35.50" data-duration="0.60" data-track-index="15" data-volume="0.6"></audio>
      <audio id="x19" src="assets/sfx/sfx_003.mp3" data-start="36.45" data-duration="2.00" data-track-index="16" data-volume="0.55"></audio>
      <audio id="x20" src="assets/sfx/sfx_002.mp3" data-start="39.50" data-duration="0.60" data-track-index="12" data-volume="0.6"></audio>
      <audio id="x21" src="assets/sfx/sfx_003.mp3" data-start="40.45" data-duration="2.00" data-track-index="13" data-volume="0.55"></audio>
      <audio id="x22" src="assets/sfx/sfx_002.mp3" data-start="43.50" data-duration="0.60" data-track-index="14" data-volume="0.6"></audio>
      <audio id="x23" src="assets/sfx/sfx_003.mp3" data-start="44.45" data-duration="2.00" data-track-index="15" data-volume="0.55"></audio>
      <audio id="x24" src="assets/sfx/sfx_002.mp3" data-start="47.50" data-duration="0.60" data-track-index="16" data-volume="0.6"></audio>
      <audio id="x25" src="assets/sfx/sfx_003.mp3" data-start="48.45" data-duration="2.00" data-track-index="12" data-volume="0.55"></audio>
      <audio id="x26" src="assets/sfx/sfx_002.mp3" data-start="52.50" data-duration="0.60" data-track-index="13" data-volume="0.6"></audio>
      <audio id="x27" src="assets/sfx/sfx_003.mp3" data-start="53.45" data-duration="2.00" data-track-index="14" data-volume="0.55"></audio>
      <audio id="x28" src="assets/sfx/sfx_002.mp3" data-start="55.50" data-duration="0.60" data-track-index="15" data-volume="0.6"></audio>
      <audio id="x29" src="assets/sfx/sfx_004.mp3" data-start="56.90" data-duration="2.50" data-track-index="16" data-volume="0.7"></audio>
    </div>
    <script>
      const OVER = [{"k":"tag","t":4.45,"d":5.2,"txt":"COSTRUISCI","c":"red"},{"k":"chip","t":5.2,"d":4.4,"n":"103","l":"tipi di pezzo","i":0},{"k":"chip","t":5.9,"d":3.7,"n":"31","l":"colori","i":1},{"k":"chip","t":6.6,"d":3,"n":"424","l":"misure","i":2},{"k":"tag","t":10.4,"d":9,"txt":"12 KIT GUIDATI","c":"blue"},{"k":"chip","t":11.2,"d":8,"n":"13→110","l":"passi, pezzo per pezzo","i":0},{"k":"tag","t":20.4,"d":6.4,"txt":"ANIMA","c":"yellow"},{"k":"chip","t":21.4,"d":5.4,"n":"24","l":"costumi","i":0},{"k":"chip","t":22.4,"d":4.4,"n":"19","l":"pettinature","i":1},{"k":"tag","t":27.3,"d":4.5,"txt":"20 ANIMALI","c":"green"},{"k":"chip","t":28.2,"d":3.6,"n":"10<sup>18</sup>","l":"personaggi possibili","i":0},{"k":"tag","t":32.3,"d":3.4,"txt":"DINAMITE","c":"red"},{"k":"tag","t":36.3,"d":3.4,"txt":"TETRIS 3D","c":"blue"},{"k":"tag","t":40.3,"d":3.4,"txt":"TERREMOTO","c":"orange"},{"k":"tag","t":44.3,"d":3.4,"txt":"CORRI!","c":"green"},{"k":"tag","t":48.3,"d":4.6,"txt":"SHOWREEL","c":"pink"},{"k":"tag","t":53.3,"d":2.5,"txt":"CONDIVIDI","c":"yellow"}];
      const CUTS = {"big":[4,20,32,48,56],"fast":[10,27,36,40,44,53]};
      const COL = {"red":"#e5222d","yellow":"#ffc72c","blue":"#2559e6","green":"#1fbf84","orange":"#ff8a1f","pink":"#ff7ab6","ink":"#1b1b2f"};
      const P = { red:"#e5222d", yellow:"#ffc72c", blue:"#2559e6", green:"#1fbf84", orange:"#ff8a1f", pink:"#ff7ab6", ink:"#1b1b2f", cream:"#fff1d0" };
      const TXT = { red:"#fff", yellow:P.ink, blue:"#fff", green:P.ink, orange:P.ink, pink:P.ink };
      function el(tag, cls, css, parent, html) {
        const e = document.createElement(tag); if (cls) e.className = cls;
        if (css) for (const k in css) { if (k.startsWith("--")) e.style.setProperty(k, css[k]); else e.style[k] = css[k]; }
        if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e;
      }
      function brick(parent, o) {
        const b = el("div", "brick", { left:o.x+"px", top:o.y+"px", width:o.w+"px", height:o.h+"px", "--c":o.c }, parent);
        const n = o.n == null ? Math.max(1, Math.round(o.w / 62)) : o.n;
        for (let i = 0; i < n; i++) { const sw = (o.w / n) * 0.62; el("div", "stud", { left:(o.w/n)*(i+0.5)-sw/2+"px", width:sw+"px" }, b); }
        if (o.txt) el("div", "bl", { fontSize:o.fs+"px", color:o.tc || "#fff" }, b, o.txt);
        return b;
      }
      const tl = gsap.timeline({ paused: true });
      const over = document.getElementById("over");

      /* ── logo di apertura (originale del gioco) ── */
      {
        const scrim = el("div", "abs", { left:0, top:0, width:"1080px", height:"1920px", background:"linear-gradient(180deg, rgba(17,20,35,.78), rgba(17,20,35,.35) 55%, rgba(17,20,35,.78))" }, over);
        tl.fromTo(scrim, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.in" }, 3.2);
        const logo = el("img", "abs", { left:"60px", top:"640px", width:"960px", filter:"drop-shadow(0 14px 0 rgba(0,0,0,.35))" }, over); logo.src = "assets/logo.png";
        tl.fromTo(logo, { scale: 0.2, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(2)", transformOrigin: "50% 50%" }, 0.45);
        tl.to(logo, { y: -12, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.2);
        tl.to(logo, { scale: 0.3, y: -560, x: -330, duration: 0.5, ease: "power3.in", transformOrigin: "50% 50%" }, 3.35);
        tl.to(logo, { opacity: 0, duration: 0.1 }, 3.85);
        const sub = el("div", "txt", { top:"900px", fontSize:"58px", color:"#fff", textShadow:"0 5px 0 rgba(0,0,0,.45)" }, over, "Il gioco di mattoncini in 3D");
        tl.fromTo(sub, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.4);
        tl.to(sub, { opacity: 0, duration: 0.3 }, 3.3);
        [["COSTRUISCI","red"],["ANIMA","yellow"],["GIOCA","blue"]].forEach(([t,c],i)=>{
          const b = brick(over, { x:250, y:1040+i*130, w:580, h:100, c:P[c], n:4, txt:t, fs:46, tc:TXT[c] });
          tl.fromTo(b, { x:(i%2?1200:-1200), opacity:0 }, { x:0, opacity:1, duration:0.5, ease:"back.out(1.6)" }, 2.0+i*0.25);
          tl.to(b, { opacity:0, duration:0.25 }, 3.3);
        });
      }

      /* ── etichette e riquadri ── */
      let tagY = 150;
      OVER.forEach((o) => {
        if (o.k === "tag") {
          const fs = 56, w = Math.round(o.txt.length * fs * 0.78 + 90);
          const b = brick(over, { x:40, y:170, w, h:104, c:P[o.c], n:Math.max(2, Math.round(w/70)), txt:o.txt, fs, tc:TXT[o.c] });
          tl.fromTo(b, { x:-900, rotation:-4, opacity:0 }, { x:0, rotation:0, opacity:1, duration:0.5, ease:"back.out(1.7)" }, o.t);
          tl.to(b, { x:-900, opacity:0, duration:0.35, ease:"power2.in" }, o.t + o.d - 0.35);
        } else {
          const c = el("div", "chip", { top:(330 + o.i*124)+"px" }, over, '<span class="n">'+o.n+'</span><span class="t">'+o.l+'</span>');
          tl.fromTo(c, { x:-900, opacity:0 }, { x:0, opacity:1, duration:0.45, ease:"back.out(1.6)" }, o.t);
          tl.to(c, { x:-900, opacity:0, duration:0.35, ease:"power2.in" }, o.t + o.d - 0.35);
        }
      });

      /* ── chiusura: sfondo crema, logo, icona, indirizzo ── */
      {
        const T = 56;
        const card = el("div", "abs", { left:0, top:0, width:"1080px", height:"1920px", background:P.cream }, over);
        tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.01 }, T);
        tl.set(card, { opacity: 0 }, 0);
        const els = [];
        const logo = el("img", "abs", { left:"60px", top:"330px", width:"960px", filter:"drop-shadow(0 12px 0 rgba(0,0,0,.2))" }, card); logo.src = "assets/logo.png";
        const icon = el("img", "abs", { left:"350px", top:"620px", width:"380px", borderRadius:"84px", boxShadow:"0 18px 0 rgba(0,0,0,.2)" }, card); icon.src = "assets/icon-512.png";
        const tag = el("div", "txt", { top:"1070px", fontFamily:'"Archivo Black"', fontWeight:400, fontSize:"60px", color:P.ink }, card, "COSTRUISCI · ANIMA · GIOCA");
        const url = el("div", "abs", { left:"90px", top:"1220px", width:"900px", height:"110px", background:P.ink, color:"#fff", borderRadius:"55px", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:"38px", boxShadow:"0 10px 0 rgba(0,0,0,.25)" }, card, "hello-noor.github.io/ulisse/ulibricks");
        const note = el("div", "txt", { top:"1400px", fontSize:"44px", fontWeight:800 }, card, "nel browser · senza account · si installa sul telefono");
        tl.fromTo(logo, { scale:0.3, opacity:0, rotation:-6 }, { scale:1, opacity:1, rotation:0, duration:0.6, ease:"back.out(2)" }, T+0.5);
        tl.fromTo(icon, { scale:0.2, opacity:0, rotation:10 }, { scale:1, opacity:1, rotation:0, duration:0.6, ease:"back.out(2)" }, T+0.9);
        tl.fromTo(tag, { y:40, opacity:0 }, { y:0, opacity:1, duration:0.5, ease:"power3.out" }, T+1.4);
        tl.fromTo(url, { y:80, opacity:0, scale:0.8 }, { y:0, opacity:1, scale:1, duration:0.55, ease:"back.out(1.8)" }, T+1.8);
        tl.fromTo(note, { y:40, opacity:0 }, { y:0, opacity:1, duration:0.5, ease:"power3.out" }, T+2.4);
        tl.to(icon, { y:-10, duration:0.8, ease:"sine.inOut", yoyo:true, repeat:1 }, T+2.2);
      }

      /* ── stacchi a strisce di mattoncini ── */
      {
        const wp = document.getElementById("wipes");
        const order = ["red","yellow","blue","green","orange","pink","ink","red"];
        const strips = [];
        for (let i = 0; i < 8; i++) strips.push(el("div", "strip", { top:i*240+"px", "--c":"" }, wp));
        gsap.set(strips, { x: -1100 });
        const all = [...CUTS.big.map(T => [T, 0.28, 0.035]), ...CUTS.fast.map(T => [T, 0.16, 0.018])].sort((a, b) => a[0] - b[0]);
        all.forEach(([T, dur, st], wi) => {
          const d = wi % 2 ? -1 : 1, lead = dur + 7 * st;
          strips.forEach((s, i) => {
            tl.set(s, { backgroundColor: P[order[(i + wi * 3) % order.length]] }, Math.max(0, T - lead - 0.2));
            tl.fromTo(s, { x: d * -1100 }, { x: 0, duration: dur, ease: "power3.out", immediateRender: false }, T - lead + i * st);
            tl.to(s, { x: d * 1100, duration: dur, ease: "power3.in" }, T + i * st);
          });
        });
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
