<!doctype html>
<html lang="it" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ULIBRICKS in 30 secondi</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --red: #e5222d;
        --yellow: #ffc72c;
        --blue: #2559e6;
        --green: #1fbf84;
        --orange: #ff8a1f;
        --pink: #ff7ab6;
        --ink: #1b1b2f;
        --cream: #fff1d0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }

      /* mattoncino */
      .brick { position: absolute; background: var(--c); border-radius: 12px;
        box-shadow: inset 0 -12px 0 rgba(0,0,0,.2), inset 0 6px 0 rgba(255,255,255,.3), 0 12px 0 rgba(0,0,0,.22); }
      .stud { position: absolute; top: -18px; height: 24px; border-radius: 12px 12px 4px 4px; background: var(--c);
        box-shadow: inset 0 -6px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35); }
      .bl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: "Archivo Black", sans-serif; line-height: 1; }
      .flat { box-shadow: none !important; }

      /* testi */
      .word { position: absolute; left: 0; width: 100%; text-align: center; font-family: "Archivo Black", sans-serif;
        line-height: 1; text-transform: uppercase; white-space: nowrap; text-shadow: 0 8px 0 rgba(0,0,0,.25); }
      .ch { display: inline-block; }
      .chip { position: absolute; background: #fff; color: var(--ink); border-radius: 60px; box-shadow: 0 10px 0 rgba(0,0,0,.22);
        display: flex; align-items: center; }
      .chip .n { font-family: "Archivo Black", sans-serif; line-height: 1; }
      .chip .t { font-weight: 800; line-height: 1.05; }
      .txt { position: absolute; left: 0; width: 100%; text-align: center; font-weight: 900; line-height: 1.1; }

      /* wipe */
      #wipes { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
      .strip { position: absolute; left: 0; width: 1080px; height: 241px; background: var(--c);
        box-shadow: inset 0 -14px 0 rgba(0,0,0,.2), inset 0 8px 0 rgba(255,255,255,.28); }

      /* omino */
      .fp { position: absolute; }
      .skin { background: #ffd43b; box-shadow: inset 0 -8px 0 rgba(0,0,0,.14), inset 0 5px 0 rgba(255,255,255,.35); }
      .cl { position: absolute; transition: none; }
    </style>
  </head>
  <body>

    <script>
      const P = { red: "#e5222d", yellow: "#ffc72c", blue: "#2559e6", green: "#1fbf84", orange: "#ff8a1f", pink: "#ff7ab6", ink: "#1b1b2f", cream: "#fff1d0", white: "#ffffff" };
      const TXT = { red: "#fff", yellow: P.ink, blue: "#fff", green: P.ink, orange: P.ink, pink: P.ink };
      const $ = (s) => document.querySelector(s);
      let seed = 7;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

      function el(tag, cls, css, parent, html) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (css) for (const k in css) { if (k.startsWith("--")) e.style.setProperty(k, css[k]); else e.style[k] = css[k]; }
        if (html != null) e.innerHTML = html;
        if (parent) parent.appendChild(e);
        return e;
      }
      function brick(parent, o) {
        const b = el("div", "brick" + (o.cls ? " " + o.cls : ""), { left: o.x + "px", top: o.y + "px", width: o.w + "px", height: o.h + "px", "--c": o.c }, parent);
        if (o.id) b.id = o.id;
        const n = o.n == null ? Math.max(1, Math.round(o.w / 62)) : o.n;
        if (n > 0) {
          const sw = (o.w / n) * 0.62;
          for (let i = 0; i < n; i++) el("div", "stud", { left: (o.w / n) * (i + 0.5) - sw / 2 + "px", width: sw + "px", top: o.sh ? -o.sh + 6 + "px" : "", height: o.sh ? o.sh + "px" : "" }, b);
        }
        if (o.txt) el("div", "bl", { fontSize: o.fs + "px", color: o.tc || "#fff" }, b, o.txt);
        return b;
      }
      function word(parent, text, y, fs, color) {
        const w = el("div", "word", { top: y + "px", fontSize: fs + "px", color }, parent);
        w.innerHTML = text.split("").map((c) => `<span class="ch">${c}</span>`).join("");
        return w;
      }
      function chip(parent, o) {
        const c = el("div", "chip", { left: o.x + "px", top: o.y + "px", width: o.w + "px", height: o.h + "px", padding: "0 " + (o.pad || 36) + "px", gap: (o.gap || 24) + "px", flexDirection: o.col ? "column" : "row", justifyContent: "center", borderRadius: o.col ? "44px" : "60px" }, parent);
        const n = el("div", "n", { fontSize: o.nf + "px", color: o.nc || P.ink }, c, o.num);
        const t = el("div", "t", { fontSize: o.tf + "px", textAlign: o.col ? "center" : "left" }, c, o.label);
        return { c, n, t };
      }
      function decor(scene, count, palette) {
        const out = [];
        for (let i = 0; i < count; i++) {
          const w = 70 + Math.floor(rnd() * 70), c = palette[i % palette.length];
          const edge = rnd() < 0.5;
          const x = edge ? (rnd() < 0.5 ? -30 + rnd() * 120 : 900 + rnd() * 140) : rnd() * 1000;
          const y = edge ? rnd() * 1800 : (rnd() < 0.5 ? 20 + rnd() * 120 : 1700 + rnd() * 120);
          const b = brick(scene, { x, y, w, h: w * 0.62, c, n: Math.max(1, Math.round(w / 60)) });
          b.style.opacity = "0.85";
          gsap.set(b, { rotation: rnd() * 60 - 30 });
          out.push(b);
        }
        return out;
      }

      const tl = gsap.timeline({ paused: true });

      // salto di un mattoncino: cade, si schiaccia e rimbalza
      function drop(e, t, o = {}) {
        const dur = o.dur || 0.4, from = o.from == null ? -900 : o.from;
        tl.fromTo(e, { y: from, opacity: 0, rotation: o.rot == null ? 0 : o.rot }, { y: 0, opacity: 1, rotation: 0, duration: dur, ease: "power3.in" }, t);
        tl.fromTo(e, { scaleY: 1, scaleX: 1, transformOrigin: "50% 100%" }, { scaleY: 0.8, scaleX: 1.1, duration: 0.07, ease: "power2.out", immediateRender: false }, t + dur);
        tl.to(e, { scaleY: 1, scaleX: 1, duration: 0.35, ease: "elastic.out(1,0.4)" }, t + dur + 0.07);
      }
      function slamWord(w, t, o = {}) {
        const chs = w.querySelectorAll(".ch");
        tl.fromTo(chs, { y: -300, opacity: 0, rotation: (i) => (i % 2 ? 14 : -14), scale: 1.3 },
          { y: 0, opacity: 1, rotation: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)", stagger: o.stagger || 0.055 }, t);
      }
      function popIn(e, t, o = {}) {
        tl.fromTo(e, { scale: 0.2, opacity: 0, rotation: o.rot == null ? -8 : o.rot }, { scale: 1, opacity: 1, rotation: 0, duration: o.dur || 0.5, ease: "back.out(2.2)" }, t);
      }
      function countTo(span, to, t0, dur, fmt) {
        const o = { v: 0 };
        tl.to(o, { v: to, duration: dur, ease: "power2.out", onUpdate() { span.textContent = fmt(o.v); } }, t0);
      }
      const fmtInt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      function drift(list, t0, dur) {
        list.forEach((b, i) => tl.to(b, { y: (i % 2 ? 50 : -50), rotation: "+=" + (i % 2 ? 14 : -14), duration: dur, ease: "none" }, t0));
      }

      /* ───────────── SCENA 1 · LOGO (0–4s) ───────────── */
      {
        const s = $("#s1");
        const dec = decor(s, 10, [P.red, P.yellow, P.blue, P.green, P.orange, P.pink]);
        const logo = el("div", "abs", { left: 0, top: 0, width: "1080px", height: "1000px" }, s);
        const uli = [["U", "red"], ["L", "yellow"], ["I", "blue"]];
        const bri = [["B", "green"], ["R", "orange"], ["I", "pink"], ["C", "red"], ["K", "blue"], ["S", "yellow"]];
        const eU = uli.map(([ch, c], i) => brick(logo, { x: 194 + i * 236, y: 380, w: 220, h: 200, c: P[c], n: 3, txt: ch, fs: 150, tc: TXT[c], sh: 22 }));
        const eB = bri.map(([ch, c], i) => brick(logo, { x: 76 + i * 156, y: 640, w: 148, h: 180, c: P[c], n: 2, txt: ch, fs: 116, tc: TXT[c], sh: 22 }));
        eU.forEach((e, i) => drop(e, 0.1 + i * 0.12, { rot: i % 2 ? 20 : -20 }));
        eB.forEach((e, i) => drop(e, 0.7 + i * 0.12, { rot: i % 2 ? -20 : 20 }));
        tl.to(logo, { y: -12, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.3);

        const tag = el("div", "txt", { top: "880px", fontSize: "52px", color: P.ink }, s, "Il gioco di mattoncini in 3D");
        tl.fromTo(tag, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.0);
        const pills = [["COSTRUISCI", "red", 1010, -1], ["ANIMA", "yellow", 1140, 1], ["GIOCA", "blue", 1270, -1]];
        pills.forEach(([t, c, y, d], i) => {
          const b = brick(s, { x: 250, y, w: 580, h: 100, c: P[c], n: 4, txt: t, fs: 46, tc: TXT[c], sh: 18 });
          tl.fromTo(b, { x: d * 1200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 2.3 + i * 0.3);
        });
        const foot = el("div", "txt", { top: "1470px", fontSize: "40px", fontWeight: 800 }, s, "nel browser · senza account");
        tl.fromTo(foot, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.1);
        drift(dec, 0, 4);
      }

      /* ───────────── SCENA 2 · COSTRUISCI (4–9s) ───────────── */
      {
        const s = $("#s2");
        const dec = decor(s, 9, [P.yellow, P.red, P.green, P.orange, P.pink, P.cream]);
        const w = word(s, "COSTRUISCI", 150, 128, "#fff");
        slamWord(w, 4.3, { stagger: 0.045 });
        const bar = brick(s, { x: 290, y: 310, w: 500, h: 30, c: P.yellow, n: 0 });
        tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 50%" }, 4.8);

        const rows = [
          [[4, "red"], [3, "yellow"], [3, "green"]],
          [[3, "blue"], [4, "orange"], [3, "red"]],
          [[5, "yellow"], [5, "blue"]],
          [[3, "pink"], [4, "green"], [3, "orange"]],
          [[4, "red"], [2, "yellow"], [4, "blue"]],
          [[2, "yellow"], [2, "green"], [2, "red"]],
        ];
        const U = 62, X0 = 225, Y0 = 1238, RH = 62;
        const plate = brick(s, { x: 160, y: 1300, w: 760, h: 56, c: P.green, n: 12 });
        tl.fromTo(plate, { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.45);
        let k = 0;
        rows.forEach((row, r) => {
          let xs = 0;
          row.forEach(([n, c], j) => {
            let off = r === 5 ? [0, 4, 8][j] : xs;
            let ww = n * U - 4;
            const b = brick(s, { x: X0 + off * U, y: Y0 - r * RH, w: ww, h: 58, c: P[c], n });
            drop(b, 4.9 + k * 0.175, { dur: 0.32, from: -700, rot: k % 2 ? 10 : -10 });
            k++;
            xs += n;
          });
        });
        // bandiera
        const pole = el("div", "abs", { left: "538px", top: "770px", width: "10px", height: "126px", background: P.cream, borderRadius: "4px" }, s);
        const flag = el("div", "abs", { left: "548px", top: "772px", width: "86px", height: "56px", background: P.yellow, clipPath: "polygon(0 0,100% 50%,0 100%)" }, s);
        tl.fromTo(pole, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, 7.75);
        tl.fromTo(flag, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, ease: "back.out(2)" }, 7.95);
        tl.to(flag, { rotation: 8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "0% 50%" }, 8.3);

        const data = [["103", 103, "tipi di pezzo", 5.0], ["31", 31, "colori", 5.5], ["13.000+", 13000, "combinazioni", 6.0]];
        data.forEach(([txt, to, lab, t], i) => {
          const c = chip(s, { x: 150, y: 420 + i * 124, w: 780, h: 104, num: "0", nf: 66, tf: 40, label: lab, pad: 44, gap: 30 });
          tl.fromTo(c.c, { x: i % 2 ? 900 : -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, t);
          countTo(c.n, to, t + 0.1, 0.9, (v) => (to === 13000 ? fmtInt(v) + (v > 12990 ? "+" : "") : fmtInt(v)));
        });
        const cap = el("div", "txt", { top: "1470px", fontSize: "60px", color: "#fff", textShadow: "0 5px 0 rgba(0,0,0,.25)" }, s, "Incastra. Ruota. Colora.");
        tl.fromTo(cap, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.9);
        drift(dec, 4, 5);
      }

      /* ───────────── SCENA 3 · ANIMA (9–14s) ───────────── */
      {
        const s = $("#s3");
        const dec = decor(s, 9, [P.yellow, P.blue, P.green, P.orange, P.red, P.cream]);
        const w = word(s, "ANIMA", 160, 244, P.ink);
        w.style.textShadow = "0 8px 0 rgba(255,255,255,.55)";

        const lines = [["Nel browser.", "red", 24.6], ["Senza account.", "blue", 25.1], ["Senza server.", "green", 25.6]];
        lines.forEach(([t, c, tt], i) => {
          const b = brick(s, { x: 70, y: 250 + i * 190, w: 940, h: 150, c: P[c], n: 6, txt: t, fs: i === 1 ? 80 : 88, tc: TXT[c], sh: 22 });
          tl.fromTo(b, { x: i % 2 ? 1300 : -1300, rotation: i % 2 ? 6 : -6, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, tt);
          tl.fromTo(b, { scale: 1 }, { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, tt + 0.5);
        });
        // lockup
        const lk = el("div", "abs", { left: 0, top: 0, width: "1080px", height: "1920px" }, s);
        const uli = [["U", "red"], ["L", "yellow"], ["I", "blue"]];
        const bri = [["B", "green"], ["R", "orange"], ["I", "pink"], ["C", "red"], ["K", "blue"], ["S", "yellow"]];
        const eU = uli.map(([ch, c], i) => brick(lk, { x: 281 + i * 186, y: 930, w: 170, h: 150, c: P[c], n: 3, txt: ch, fs: 110, tc: TXT[c], sh: 20 }));
        const eB = bri.map(([ch, c], i) => brick(lk, { x: 111 + i * 144, y: 1130, w: 136, h: 140, c: P[c], n: 2, txt: ch, fs: 90, tc: TXT[c], sh: 20 }));
        eU.forEach((e, i) => drop(e, 26.7 + i * 0.1, { dur: 0.35, rot: i % 2 ? 16 : -16 }));
        eB.forEach((e, i) => drop(e, 27.0 + i * 0.1, { dur: 0.35, rot: i % 2 ? -16 : 16 }));
        const url = el("div", "abs", { left: "110px", top: "1360px", width: "860px", height: "96px", background: P.ink, color: "#fff", borderRadius: "48px", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: "34px", boxShadow: "0 10px 0 rgba(0,0,0,.25)" }, s, "hello-noor.github.io/ulisse/ulibricks");
        tl.fromTo(url, { y: 80, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 27.7);
        const tag = el("div", "txt", { top: "1520px", fontFamily: '"Archivo Black"', fontSize: "60px", fontWeight: 400, color: P.ink }, s, "COSTRUISCI · ANIMA · GIOCA");
        tl.fromTo(tag, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 28.2);
        tl.to(lk, { y: -10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 28.3);
        drift(dec, 24, 6);
      }

      /* ───────────── TRANSIZIONI A MATTONCINI ───────────── */
      {
        const wp = $("#wipes");
        const order = ["red", "yellow", "blue", "green", "orange", "pink", "ink", "red"];
        const strips = [];
        for (let i = 0; i < 8; i++) strips.push(el("div", "strip", { top: i * 240 + "px", "--c": "" }, wp));
        gsap.set(strips, { x: -1100 });
        [4, 9, 14, 19, 24].forEach((T, wi) => {
          const d = wi % 2 ? -1 : 1;
          strips.forEach((st, i) => {
            const col = P[order[(i + wi * 3) % order.length]];
            tl.set(st, { backgroundColor: col }, T - 0.8);
            tl.fromTo(st, { x: d * -1100 }, { x: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, T - 0.525 + i * 0.035);
            tl.to(st, { x: d * 1100, duration: 0.28, ease: "power3.in" }, T + i * 0.035);
          });
        });
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
